<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080306">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="INTIMACY">
    <title>INTIMACY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Heebo:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:          #080306;
            --ink-2:        #150508;
            --ink-3:        #1f0810;
            --blood-deep:   #9f1239;
            --blood:        #e02b4f;
            --rose:         #ff5277;
            --rose-soft:    #ff8aa6;
            --ember:        #ff8a5b;
            --ember-soft:   #ffb38e;
            --gold:         #f5c46e;
            --gold-soft:    #fde2a3;
            --bone:         #fff5ed;
            --bone-mute:    rgba(255,245,237,0.58);
            --hair:         rgba(255,245,237,0.08);
            --hair-2:       rgba(255,245,237,0.14);
        }
        * { -webkit-tap-highlight-color: transparent; }
        html, body {
            background-color: var(--ink);
            color: var(--bone);
            font-family: 'Heebo', 'Cormorant Garamond', system-ui, sans-serif;
            font-weight: 300;
            letter-spacing: 0.005em;
            overflow-x: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(70% 50% at 15% 12%,  rgba(224,43,79,0.30) 0%, transparent 60%),
                radial-gradient(60% 50% at 85% 22%,  rgba(245,196,110,0.16) 0%, transparent 65%),
                radial-gradient(80% 60% at 50% 100%, rgba(159,18,57,0.30) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
            animation: drift 22s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: fixed; inset: 0;
            background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.012) 1px, transparent 1px);
            background-size: 3px 3px;
            opacity: 0.5;
            pointer-events: none; z-index: 0;
            mix-blend-mode: overlay;
        }
        @keyframes drift {
            0%, 100% { transform: translate3d(0,0,0) scale(1); }
            33%      { transform: translate3d(-2%, 1%, 0) scale(1.05); }
            66%      { transform: translate3d(2%, -1%, 0) scale(0.98); }
        }
        .font-display { font-family: 'Playfair Display', 'Frank Ruhl Libre', serif; font-weight: 600; letter-spacing: -0.02em; }
        .font-italic  { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; letter-spacing: 0.01em; }
        .font-body    { font-family: 'Heebo', sans-serif; }
        .font-eyebrow { font-family: 'Heebo', sans-serif; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; }
        .glass {
            background: linear-gradient(160deg, rgba(255,245,237,0.04) 0%, rgba(255,245,237,0.012) 100%);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid var(--hair-2);
            border-radius: 28px;
        }
        .glass-deep {
            background: linear-gradient(160deg, rgba(21,5,8,0.70) 0%, rgba(31,8,16,0.60) 100%);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid var(--hair-2);
            border-radius: 32px;
        }
        .glow-rose   { box-shadow: 0 0 0 1px rgba(224,43,79,0.35),  0 18px 60px -20px rgba(224,43,79,0.55); }
        .glow-violet { box-shadow: 0 0 0 1px rgba(255,138,91,0.30), 0 18px 60px -20px rgba(255,138,91,0.50); }
        .glow-azure  { box-shadow: 0 0 0 1px rgba(245,196,110,0.32), 0 18px 60px -20px rgba(245,196,110,0.45); }
        .glow-soft   { box-shadow: 0 0 0 1px var(--hair-2),         0 12px 40px -16px rgba(224,43,79,0.28); }
        .btn-primary {
            background: linear-gradient(135deg, var(--blood-deep) 0%, var(--blood) 50%, var(--ember) 100%);
            background-size: 200% 200%;
            border-radius: 9999px;
            padding: 1.05rem 2rem;
            color: #fff;
            font-family: 'Heebo', sans-serif;
            font-weight: 600;
            letter-spacing: 0.12em;
            font-size: 0.95rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.24), 0 14px 40px -10px rgba(224,43,79,0.65), 0 8px 24px -8px rgba(159,18,57,0.55);
            transition: transform 0.18s cubic-bezier(0.16,1,0.3,1), background-position 0.5s ease, box-shadow 0.25s ease;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .btn-primary:hover { background-position: 100% 0; transform: translateY(-1px); }
        .btn-primary:active { transform: scale(0.985); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost {
            background: rgba(255,245,237,0.04);
            border: 1px solid var(--hair-2);
            border-radius: 9999px;
            padding: 0.85rem 1.4rem;
            color: var(--bone-mute);
            font-family: 'Heebo', sans-serif;
            font-weight: 500;
            letter-spacing: 0.18em;
            font-size: 0.72rem;
            text-transform: uppercase;
            transition: all 0.2s ease;
            cursor: pointer;
            width: 100%;
        }
        .btn-ghost:hover { background: rgba(255,245,237,0.07); color: var(--bone); }
        .pill {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-family: 'Heebo', sans-serif;
            font-weight: 500;
            letter-spacing: 0.22em;
            font-size: 0.62rem;
            text-transform: uppercase;
            border: 1px solid var(--hair-2);
        }
        .pill-rose   { color: var(--rose-soft);   background: rgba(224,43,79,0.12);  border-color: rgba(224,43,79,0.30); }
        .pill-violet { color: var(--ember-soft);  background: rgba(255,138,91,0.10); border-color: rgba(255,138,91,0.30); }
        .pill-azure  { color: var(--gold);        background: rgba(245,196,110,0.10); border-color: rgba(245,196,110,0.30); }
        .pill-bone   { color: var(--bone);        background: rgba(255,245,237,0.06); border-color: var(--hair-2); }
        .heat-track {
            position: relative;
            height: 3px;
            border-radius: 9999px;
            background: var(--hair);
            overflow: hidden;
        }
        .heat-fill {
            position: absolute; inset: 0;
            background: linear-gradient(90deg, var(--gold) 0%, var(--ember) 50%, var(--blood) 100%);
            border-radius: 9999px;
            box-shadow: 0 0 14px rgba(224,43,79,0.60);
            transition: width 1s cubic-bezier(0.16,1,0.3,1);
        }
        .perspective-1000 { perspective: 1400px; -webkit-perspective: 1400px; }
        .preserve-3d      { transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
        .backface-hidden  { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rot-y-180        { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }
        .rot-y-90         { transform: rotateY(90deg); -webkit-transform: rotateY(90deg); }
        .rot-y-0          { transform: rotateY(0deg); -webkit-transform: rotateY(0deg); }
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(10px); filter: blur(6px); }
            to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
        }
        .animate-fade-up { animation: fade-up 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes pulse-glow {
            0%,100% { box-shadow: 0 0 0 1px rgba(224,43,79,0.35), 0 0 40px -8px rgba(224,43,79,0.55); }
            50%     { box-shadow: 0 0 0 1px rgba(245,196,110,0.50), 0 0 80px -8px rgba(255,138,91,0.65); }
        }
        .animate-pulse-glow { animation: pulse-glow 4s ease-in-out infinite; }
        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-text {
            background: linear-gradient(90deg, var(--bone) 0%, var(--gold-soft) 25%, var(--rose) 50%, var(--blood) 75%, var(--bone) 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 8s linear infinite;
        }
        @keyframes draw-float {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50%      { transform: translateY(-6px) rotate(1deg); }
        }
        .animate-draw-float { animation: draw-float 5s ease-in-out infinite; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--hair-2); border-radius: 9999px; }
        .custom-scroll { scrollbar-width: thin; scrollbar-color: var(--hair-2) transparent; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001s !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001s !important;
            }
        }
        :focus-visible {
            outline: 2px solid var(--blood);
            outline-offset: 3px;
            border-radius: 4px;
        }
        .text-bone    { color: var(--bone); }
        .text-mute    { color: var(--bone-mute); }
        .text-rose    { color: var(--blood); }
        .text-rose-soft { color: var(--rose); }
        .text-violet  { color: var(--ember); }
        .text-azure   { color: var(--gold); }
        .border-hair  { border-color: var(--hair); }
        .border-hair-2 { border-color: var(--hair-2); }
        .bg-ink       { background-color: var(--ink); }
        .bg-ink-2     { background-color: var(--ink-2); }
        .bg-ink-3     { background-color: var(--ink-3); }
        .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
    </style>
