<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080306">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="INTIMACY">
    <title>INTIMACY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:          #080306;
            --ink-2:        #150508;
            --ink-3:        #1f0810;
            --blood-deep:   #9f1239;
            --blood:        #e02b4f;
            --rose:         #ff5277;
            --rose-soft:    #ff8aa6;
            --ember:        #ff8a5b;
            --ember-soft:   #ffb38e;
            --gold:         #f5c46e;
            --gold-soft:    #fde2a3;
            --bone:         #fff5ed;
            --bone-mute:    rgba(255,245,237,0.55);
            --bone-faint:   rgba(255,245,237,0.32);
            --hair:         rgba(255,245,237,0.06);
            --hair-2:       rgba(255,245,237,0.12);
        }

        * { -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; box-sizing: border-box; }

        html, body, #root {
            height: 100dvh;
            width: 100%;
            background: var(--ink);
            color: var(--bone);
            font-family: 'Assistant', 'Plus Jakarta Sans', system-ui, sans-serif;
            font-weight: 300;
            font-feature-settings: 'ss01', 'cv11';
            direction: rtl;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            letter-spacing: 0.005em;
        }

        /* iOS — no auto-zoom on input */
        input, select, textarea { font-size: 16px !important; }

        /* === ATMOSPHERIC BACKGROUND — deep, cinematic === */
        .bg-ritual {
            background:
                radial-gradient(ellipse 80% 60% at 30% 22%, rgba(224,43,79,0.20) 0%, transparent 60%),
                radial-gradient(ellipse 70% 55% at 85% 28%, rgba(245,196,110,0.13) 0%, transparent 65%),
                radial-gradient(ellipse 90% 60% at 50% 100%, rgba(159,18,57,0.30) 0%, transparent 70%),
                radial-gradient(ellipse at 50% 50%, #1a050a 0%, #0d0306 55%, #080306 100%);
        }
        .bg-warm-deep {
            background:
                radial-gradient(ellipse 80% 60% at 40% 30%, rgba(255,82,119,0.22) 0%, transparent 65%),
                radial-gradient(ellipse at 50% 50%, #210610 0%, #120308 50%, #080306 100%);
        }
        .bg-fire-deep {
            background:
                radial-gradient(ellipse 80% 60% at 50% 50%, rgba(224,43,79,0.30) 0%, transparent 70%),
                radial-gradient(ellipse at 50% 50%, #2d0612 0%, #170509 40%, #080306 100%);
        }

        /* === FILM GRAIN — subtle premium texture === */
        .film-grain {
            position: absolute; inset: 0;
            opacity: 0.06;
            mix-blend-mode: overlay;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* === Typography classes — modern web (Vercel / Linear vibes) — NO italic, color-based accent === */
        .font-display { font-family: 'Assistant', 'Plus Jakarta Sans', sans-serif; font-weight: 600; letter-spacing: -0.015em; }
        .font-body    { font-family: 'Assistant', 'Plus Jakarta Sans', sans-serif; font-weight: 400; }
        .font-thin    { font-family: 'Plus Jakarta Sans', 'Assistant', sans-serif; font-weight: 200; letter-spacing: 0.005em; }
        .font-light   { font-family: 'Assistant', 'Plus Jakarta Sans', sans-serif; font-weight: 300; }
        .font-mark    { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 300; letter-spacing: -0.01em; }
        .font-eyebrow { font-family: 'Plus Jakarta Sans', 'Assistant', sans-serif; font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase; font-size: 0.68rem; }

        /* Accent text — replaces italic. Pink-coral, regular weight, slightly looser */
        .font-accent  { font-family: 'Assistant', 'Plus Jakarta Sans', sans-serif; font-weight: 400; color: var(--rose); letter-spacing: 0.01em; }
        .font-accent-soft { font-family: 'Assistant', 'Plus Jakarta Sans', sans-serif; font-weight: 400; color: var(--rose-soft); letter-spacing: 0.01em; }
        .font-accent-gold { font-family: 'Assistant', 'Plus Jakarta Sans', sans-serif; font-weight: 400; color: var(--gold-soft); letter-spacing: 0.01em; }
        /* Legacy compatibility — old .font-italic now maps to coral accent (no italic) */
        .font-italic { font-family: 'Assistant', 'Plus Jakarta Sans', sans-serif; font-weight: 400; color: var(--rose); font-style: normal; letter-spacing: 0.01em; }

        /* Sexy typographic glyphs */
        .glyph-spark::before  { content: '✦'; margin-inline-end: 0.5em; color: var(--rose); }
        .glyph-spark::after   { content: '✦'; margin-inline-start: 0.5em; color: var(--rose); }
        .glyph-diamond::before { content: '◆'; margin-inline-end: 0.45em; color: var(--gold); font-size: 0.7em; vertical-align: 0.1em; }
        .glyph-dot::before    { content: '·'; margin-inline-end: 0.45em; color: var(--rose-soft); font-weight: 700; }
        .glyph-dash::before   { content: '⌇'; margin-inline-end: 0.45em; color: var(--rose); }
        .divider-spark { display:flex; align-items:center; justify-content:center; gap:0.7em; color: var(--rose); font-size: 0.7rem; }
        .divider-spark::before, .divider-spark::after {
            content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,82,119,0.35), transparent);
        }

        /* === GLASS — milled premium glass with depth === */
        .glass {
            background: linear-gradient(145deg, rgba(255,245,237,0.045) 0%, rgba(255,245,237,0.008) 100%);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(255,245,237,0.06);
            border-radius: 26px;
            box-shadow:
                0 16px 40px -10px rgba(0,0,0,0.55),
                inset 0 1px 0 0 rgba(255,245,237,0.12),
                inset 0 -1px 0 0 rgba(0,0,0,0.20);
        }
        .glass-deep {
            background: linear-gradient(160deg, rgba(21,5,8,0.78) 0%, rgba(31,8,16,0.66) 100%);
            backdrop-filter: blur(28px) saturate(170%);
            -webkit-backdrop-filter: blur(28px) saturate(170%);
            border: 1px solid rgba(255,245,237,0.07);
            border-radius: 30px;
            box-shadow:
                0 22px 60px -14px rgba(0,0,0,0.7),
                inset 0 1px 0 0 rgba(255,245,237,0.10),
                inset 0 -1px 0 0 rgba(0,0,0,0.25);
        }

        /* === GLOW HALO — soft luxury halo === */
        .halo { position: relative; }
        .halo::before {
            content: '';
            position: absolute;
            inset: -30%;
            background: radial-gradient(circle, rgba(224,43,79,0.20) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }
        .halo-gold::before { background: radial-gradient(circle, rgba(245,196,110,0.18) 0%, transparent 60%); }
        .halo-ember::before { background: radial-gradient(circle, rgba(255,138,91,0.20) 0%, transparent 60%); }

        /* === ACTION BUTTON — spring physics, premium === */
        .action-btn {
            background: linear-gradient(135deg, rgba(159,18,57,0.92), rgba(224,43,79,0.96) 55%, rgba(255,138,91,0.90));
            background-size: 200% 200%;
            border-radius: 9999px;
            padding: 1.05rem 2rem;
            color: #fff;
            font-family: 'Assistant', 'Plus Jakarta Sans', sans-serif;
            font-weight: 500;
            letter-spacing: 0.10em;
            font-size: 0.95rem;
            border: 1px solid rgba(255,138,91,0.30);
            box-shadow:
                0 0 50px rgba(224,43,79,0.35),
                0 8px 28px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.20),
                inset 0 -1px 0 rgba(0,0,0,0.20);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, box-shadow, background-position;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .action-btn:hover {
            background-position: 100% 0;
            box-shadow:
                0 0 80px rgba(224,43,79,0.50),
                0 14px 40px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.24),
                inset 0 -1px 0 rgba(0,0,0,0.25);
            transform: translateY(-3px) scale(1.012);
        }
        .action-btn:active {
            transition: all 0.1s ease;
            transform: translateY(1px) scale(0.985);
        }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* === SECONDARY BUTTON === */
        .secondary-btn {
            background: rgba(255,245,237,0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,245,237,0.10);
            border-radius: 9999px;
            padding: 0.85rem 1.4rem;
            color: var(--bone-mute);
            font-family: 'Assistant', sans-serif;
            font-weight: 400;
            letter-spacing: 0.16em;
            font-size: 0.75rem;
            text-transform: uppercase;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            width: 100%;
        }
        .secondary-btn:hover {
            background: rgba(255,245,237,0.08);
            border-color: rgba(255,245,237,0.18);
            color: var(--bone);
            transform: translateY(-2px);
        }
        .secondary-btn:active { transform: translateY(0) scale(0.98); transition: all 0.1s ease; }

        /* === PILLS === */
        .pill {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-family: 'Plus Jakarta Sans', 'Assistant', sans-serif;
            font-weight: 500;
            letter-spacing: 0.22em;
            font-size: 0.62rem;
            text-transform: uppercase;
            border: 1px solid var(--hair-2);
        }
        .pill-rose   { color: var(--rose-soft);   background: rgba(224,43,79,0.12);  border-color: rgba(224,43,79,0.30); }
        .pill-violet { color: var(--ember-soft);  background: rgba(255,138,91,0.10); border-color: rgba(255,138,91,0.30); }
        .pill-azure  { color: var(--gold);        background: rgba(245,196,110,0.10); border-color: rgba(245,196,110,0.30); }
        .pill-bone   { color: var(--bone);        background: rgba(255,245,237,0.06); border-color: var(--hair-2); }

        /* === HEAT TRACK (progress bar) === */
        .heat-track {
            position: relative; height: 2px; border-radius: 9999px;
            background: var(--hair);
            overflow: hidden;
        }
        .heat-fill {
            position: absolute; inset: 0;
            background: linear-gradient(90deg, var(--gold) 0%, var(--ember) 45%, var(--blood) 100%);
            border-radius: 9999px;
            box-shadow: 0 0 14px rgba(224,43,79,0.55);
            transition: width 1s cubic-bezier(0.16,1,0.3,1);
        }

        /* === SMOKY WORD APPEAR — emerges from mist (RRXO signature) === */
        .word-appear {
            animation: wordAppear 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            will-change: opacity, transform, filter;
        }
        @keyframes wordAppear {
            0%   { opacity: 0; filter: blur(10px); transform: translateY(12px) scale(0.985); }
            55%  { opacity: 0.80; filter: blur(2px); }
            100% { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
        }

        /* Word-appear with stagger — apply data-delay on element */
        .word-appear-1 { animation-delay: 0.08s; }
        .word-appear-2 { animation-delay: 0.16s; }
        .word-appear-3 { animation-delay: 0.26s; }
        .word-appear-4 { animation-delay: 0.38s; }
        .word-appear-5 { animation-delay: 0.52s; }
        .word-appear-6 { animation-delay: 0.68s; }

        /* === SCREEN FADE — between mounted screens === */
        .screen-fade {
            animation: screenFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            will-change: opacity, filter, transform;
        }
        @keyframes screenFadeIn {
            0%   { opacity: 0; filter: blur(8px); transform: scale(0.99); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }
        .animate-fade-up { animation: screenFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* === ORGANIC MORPH — for active phase indicators === */
        @keyframes organicMorph {
            0%, 100% { border-radius: 48% 52% 60% 40% / 50% 45% 55% 50%; }
            33%      { border-radius: 60% 40% 45% 55% / 45% 60% 40% 55%; }
            66%      { border-radius: 42% 58% 55% 45% / 55% 50% 50% 45%; }
        }
        .morph-shape { animation: organicMorph 8s ease-in-out infinite; }

        /* === SHIMMER TEXT === */
        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-text {
            background: linear-gradient(90deg, var(--bone) 0%, var(--gold-soft) 25%, var(--rose) 50%, var(--blood) 75%, var(--bone) 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 9s linear infinite;
        }

        /* === PULSE GLOW === */
        @keyframes pulse-glow {
            0%,100% { box-shadow: 0 0 0 1px rgba(224,43,79,0.30), 0 0 40px -8px rgba(224,43,79,0.50); }
            50%     { box-shadow: 0 0 0 1px rgba(245,196,110,0.45), 0 0 70px -8px rgba(255,138,91,0.60); }
        }
        .animate-pulse-glow { animation: pulse-glow 4s ease-in-out infinite; }

        /* === DRAW CARD FLOAT === */
        @keyframes draw-float {
            0%, 100% { transform: translateY(0) rotate(-1.2deg); }
            50%      { transform: translateY(-8px) rotate(1.2deg); }
        }
        .animate-draw-float { animation: draw-float 5s ease-in-out infinite; }

        /* === CUSTOM SCROLLBAR === */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(224,43,79,0.3); border-radius: 999px; }
        ::selection { background: rgba(224,43,79,0.30); color: var(--bone); }

        /* === iOS safe area === */
        @supports (padding: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }

        /* === Reduced motion === */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .word-appear { opacity: 1 !important; filter: none !important; transform: none !important; }
        }

        :focus-visible {
            outline: 2px solid var(--blood);
            outline-offset: 3px;
            border-radius: 4px;
        }

        /* Semantic utilities */
        .text-bone    { color: var(--bone); }
        .text-mute    { color: var(--bone-mute); }
        .text-faint   { color: var(--bone-faint); }
        .text-rose    { color: var(--blood); }
        .text-rose-soft { color: var(--rose); }
        .text-violet  { color: var(--ember); }
        .text-azure   { color: var(--gold); }
        .text-gold-soft { color: var(--gold-soft); }
        .border-hair  { border-color: var(--hair); }
        .border-hair-2 { border-color: var(--hair-2); }
        .bg-ink       { background-color: var(--ink); }
        .bg-ink-2     { background-color: var(--ink-2); }
        .bg-ink-3     { background-color: var(--ink-3); }
        .sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0; }
    </style>
